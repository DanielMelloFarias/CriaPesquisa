name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + build)
    runs-on: ubuntu-latest

    # Postgres de verdade: parte da suíte fala com o banco, e mockar isso
    # esconderia justamente os erros de schema que interessam pegar aqui.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: criapesquisa_ci
          POSTGRES_USER: cria_ci
          POSTGRES_PASSWORD: cria_ci
        options: >-
          --health-cmd "pg_isready -U cria_ci -d criapesquisa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    env:
      DATABASE_URL: postgresql://cria_ci:cria_ci@localhost:5433/criapesquisa_ci?schema=public
      JWT_SECRET: segredo-apenas-para-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Aplica as migrations versionadas — é também a prova de que elas montam
      # o schema do zero, já que o banco da CI nasce vazio a cada execução.
      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Vulnerabilidade que chega ao ar é a que vem de dependência de produção;
      # as de desenvolvimento não vão para a imagem.
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (testes + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Testes
        run: npm test

      # `npm run build` já roda `tsc --noEmit` antes do vite: type-check incluso.
      - name: Build
        run: npm run build

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Não publicamos as imagens aqui — só garantimos que os Dockerfiles
      # continuam construindo, para o dia do deploy não ser a primeira tentativa.
      - name: Build da imagem da API
        run: docker build -t criapesquisa-api:ci ./backend

      - name: Build da imagem do front
        run: docker build -t criapesquisa-web:ci ./frontend
