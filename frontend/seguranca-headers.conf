# Cabeçalhos de segurança das páginas, incluídos em cada location do nginx.conf.
# No nginx, uma location que tem o próprio add_header ignora TODOS os add_header
# do bloco server — por isso eles moram aqui e cada location inclui o arquivo.
# A /api não inclui: o helmet da API já manda os dela.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
# Chega ao navegador pelo HTTPS do proxy que termina o TLS (Traefik); o nginx não
# precisa falar HTTPS para isso.
add_header Strict-Transport-Security "max-age=31536000" always;
# Só relatório: o navegador avisa no console o que a política bloquearia, sem
# bloquear nada. Depois de usar as telas sem avisos, troque o nome do cabeçalho
# por Content-Security-Policy. 'unsafe-inline' em style-src: o styled-components
# injeta estilos na página.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
