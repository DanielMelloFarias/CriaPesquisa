server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx nas respostas.
    server_tokens off;

    # Os cabeçalhos de segurança das páginas ficam em seguranca-headers.conf,
    # incluído em cada location abaixo (ver o comentário daquele arquivo).

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os arquivos de assets levam hash no nome: mudou o conteúdo, mudou o nome.
    # Por isso podem ser guardados por muito tempo sem risco de servir versão velha.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguranca-headers.conf;
        try_files $uri =404;
    }

    # index.html nunca em cache: é ele que aponta para o bundle novo depois de
    # um deploy. Em cache, o navegador continuaria abrindo a versão anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguranca-headers.conf;
    }

    # SPA: qualquer rota do React Router cai no index.html, senão um F5 em
    # /pesquisas/123 devolveria 404.
    location / {
        include /etc/nginx/snippets/seguranca-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Encaminha a API para o backend, permitindo servir tudo na mesma origem
    # (com VITE_API_URL=/api não há CORS nem porta extra exposta).
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # É daqui que o rate limit tira o IP real — por isso a API precisa de
        # TRUST_PROXY=1 quando roda atrás deste nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
